kind = "web"
previewPath = "/"
title = "Personal Brand — Holding Page"
version = "1.0.0"
id = "artifacts/holding-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22102

[services.development]
run = "pnpm --filter @workspace/holding-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/holding-page", "run", "build" ]
publicDir = "artifacts/holding-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22102"
BASE_PATH = "/"
